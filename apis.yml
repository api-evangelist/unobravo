aid: unobravo
name: Unobravo
description: 'Unobravo is Europe''s largest online psychology service, founded in 2019
  by psychologist Danila De Stefano. It matches people with one of 9,500+ individually
  vetted psychologists and psychotherapists for individual, couples, and group therapy
  delivered online, serving Italy, Spain, and France as well as Italians abroad, with
  500,000+ people supported across more than 10 million online sessions, plus a B2B
  mental-wellbeing offering (Unobravo Business) and an ECM training academy. Backed
  by Insight Partners and Northzone. Its backend API (api.unobravo.com) is private,
  with no public developer surface.'
